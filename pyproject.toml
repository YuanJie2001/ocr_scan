[project]
name = "ocrid"
version = "0.1.0"
description = "A high-performance OCR tool for text recognition2PDF."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "cnocr>=2.3.0",
    "numpy>=2.2.3",
    "opencv-python>=4.5.0",
    "reportlab>=4.4.7",
    "torch",
    "torchaudio",
    "torchvision",
]

[[tool.uv.index]]
name = "internal-proxy"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
[[tool.uv.index]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"
