[project]
name = "ocrid"
version = "0.2.0"
description = "A high-performance OCR tool for ID card photo to electronic PDF."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=2.2.3",
    "opencv-python>=4.5.0",
    "reportlab>=4.4.7",
    "rapidocr>=3.0.0,<3.8.0",
    "onnxruntime>=1.17.0",
    "albumentations==1.3.1",
    "setuptools>=82.0.1",
    "PyQt6>=6.6.0",
]


# PyPI
[[tool.uv.index]]
name = "internal-proxy"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"
